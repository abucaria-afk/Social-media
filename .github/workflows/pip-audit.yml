name: pip-audit

on:
  schedule:
    - cron: '0 0 * * 0' # weekly
  # Also whenever the dependencies themselves change. A weekly-only audit
  # means a vulnerable pin can sit in main for six days without a word.
  push:
    paths:
      - 'requirements.txt'
      - 'pyproject.toml'
      - '.github/workflows/pip-audit.yml'
  pull_request:
    paths:
      - 'requirements.txt'
      - 'pyproject.toml'
  workflow_dispatch:

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      # `trailofbits/pip-audit-action` used to be here. It no longer exists —
      # the project moved to pypa — so every run failed with "repository not
      # found" before it audited a single package. Nobody saw it, because the
      # workflow only ran on a weekly schedule; adding the push trigger above
      # is what surfaced it on the first commit.
      #
      # pip-audit is a PyPI package and running it directly is one fewer
      # third-party action to trust in the workflow whose entire job is to
      # notice untrustworthy dependencies.
      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit

      - name: Audit the pinned dependencies
        run: pip-audit --requirement requirements.txt --progress-spinner off
