name: tests

# The suite synthesises its own footage, so there is nothing to check in and
# nothing to fetch beyond the packages.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  # A newer push to the same branch makes the older run pointless.
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The oldest version pyproject claims to support, and a current one.
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        # Not requirements.txt: `anthropic` is optional at runtime, and the
        # algorithmic director is what CI should be exercising anyway — there
        # is no API key here, and the film has to get made without one.
        run: |
          python -m pip install --upgrade pip
          pip install numpy pillow ffmpeg-binaries pytest

      - name: ffmpeg is reachable
        run: python -c "from auteur import ffmpeg; print(ffmpeg.ffmpeg_path(), ffmpeg.ffprobe_path())"

      - name: Tests
        # Includes the slow ones: they are the only thing that renders real
        # video, and every silent failure this project has had was in there.
        run: python -m pytest tests/ -q

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff
      - run: ruff check auteur tests
