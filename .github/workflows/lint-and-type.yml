name: Lint and Type Check

on:
  push:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # One version, not three. ruff and black read the same source and
          # reach the same verdict on every interpreter; the old matrix paid
          # for three identical answers. What genuinely varies across versions
          # is whether the code *runs*, and Python CI already tests that.
          python-version: '3.12'
          cache: pip

      - name: Install tooling
        run: python -m pip install --upgrade pip ruff black mypy

      - name: Run ruff
        run: ruff check .

      - name: Check formatting with black
        run: black --check . || (echo "Run 'black .' to format" && false)

      # Advisory, and marked as such. `mypy || true` printed a green tick over
      # whatever mypy said; continue-on-error shows the real result and the
      # real warning, without failing a build over annotations this project
      # has not committed to yet.
      - name: Run mypy (advisory)
        continue-on-error: true
        run: mypy --ignore-missing-imports .
