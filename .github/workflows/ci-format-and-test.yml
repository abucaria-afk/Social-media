name: CI — tests, linters, Black
on:
  push:
    branches:
      - main
      - fix/black-format
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install black==24.1.0 flake8 mypy pytest

      - name: Run tests
        run: |
          if [ -f pytest.ini ] || [ -d tests ]; then
            pytest -q || true
          else
            echo "No tests detected (no tests/ dir or pytest.ini)."
          fi

      - name: Run flake8
        run: |
          if command -v flake8 >/dev/null 2>&1; then
            flake8 || true
          fi

      - name: Run mypy
        run: |
          if [ -d src ] || [ -f pyproject.toml ]; then
            mypy . || true
          else
            echo "Skipping mypy (no obvious project layout)."
          fi

      - name: Check Black formatting
        id: black_check
        run: |
          set -o pipefail
          black --line-length 88 --check . || echo "::set-output name=needs_format::true"
        continue-on-error: true

      - name: Apply Black and commit if needed
        if: steps.black_check.outputs.needs_format == 'true'
        run: |
          black --line-length 88 .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: format Python code with Black" || echo "No changes to commit"
          git push origin HEAD:fix/black-format
