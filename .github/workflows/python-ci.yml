name: Python CI

on:
  # Every branch, not only main. A workflow that runs after the merge tells
  # you what you already shipped; this one has to run before it.
  push:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Only the newest commit on a branch is worth testing. Without this, pushing
# three times in five minutes runs nine jobs and reports on the oldest one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Do not stop the other versions because one failed. Knowing it breaks
      # on 3.10 *and* passes on 3.12 is the useful shape of that answer.
      fail-fast: false
      matrix:
        # Quoted: unquoted 3.10 is the *number* 3.1 in YAML, and
        # setup-python then tries to install Python 3.1 and fails,
        # cancelling the whole matrix. These jobs never ran a test.
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          # setup-python's own cache replaces a hand-rolled actions/cache step
          # and keys itself on the requirements file without being told.
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          # Explicit, so the test step can never "helpfully" skip itself.
          python -m pip install pytest

      - name: Run tests
        run: pytest -q
