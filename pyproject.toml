[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "auteur"
version = "1.0.0"
description = "An autonomous cinematic editor: clips in, finished film out."
readme = "AUTEUR.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=2.2.6",
    "pillow>=10.0",
]

[project.optional-dependencies]
# Wheel-bundled static ffmpeg + ffprobe. A system ffmpeg works too, but distro
# builds sometimes ship without libx264, xfade or loudnorm.
ffmpeg = ["ffmpeg-binaries>=1.1.0"]
# Lets Claude direct the edit. Without it the algorithmic director is used.
llm = ["anthropic>=0.124.0"]
# The Scholar's only way to reach YouTube. Metadata and captions only — it never
# downloads video. Without it the Scholar says it cannot study rather than
# quietly reporting that it studied nothing.
scholar = ["yt-dlp>=2026.8.19"]
# Signing in with Apple: their client secret is an ES256 JWT the server signs
# itself. `requirements.txt` installs it unconditionally because a deployment
# that cannot offer it has an App Store guideline 4.8 problem; here it is an
# extra, because making a film locally never touches it.
signin = ["cryptography>=43"]
dev = ["pytest>=9.1.1"]

[project.scripts]
auteur = "auteur.cli:main"

[tool.setuptools.packages.find]
include = ["auteur*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: renders video; needs ffmpeg and takes a minute or two"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# The defaults plus the checks that catch real mistakes in this codebase:
# unused imports and names (F), bugbear's mutable-default and loop-variable
# traps (B), and comprehension/loop slips (C4).
select = ["E", "F", "W", "B", "C4", "UP"]
ignore = [
    # Long lines are already capped at 100; the odd filter-graph string that
    # runs over is more readable whole than folded.
    "E501",
    # `except Exception` is deliberate in the few places it appears: a mailer,
    # an icon, and a render must never take the whole server down with them.
    "B904",
]

[tool.ruff.lint.per-file-ignores]
# Tests import inside functions on purpose, to keep the module import cheap.
"tests/*" = ["E402"]

[tool.black]
# Matches the ruff line-length above, so the two never disagree about a line.
line-length = 100
target-version = ["py310"]
